name: Inspect YTPlus Runtime Integration Points

on:
  push:
    branches: [feature/traptube-ytplus-native-rebrand]
    paths:
      - .github/workflows/inspect-ytplus-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout analysis workflow
        uses: actions/checkout@v4

      - name: Download pinned YTPlus host
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/vulturefilezexclusive-svg/TrapTube/releases/download/ytplus-reference/YouTube.21.40.5.YTPlus.6.0b2.@ipavault.ipa'
          curl --fail --location --retry 3 "$URL" -o reference.ipa
          echo 'a3b3c51480efa95e3eba6b2389398e7f1de5b1685427973f4769efbb3b2514af  reference.ipa' | shasum -a 256 -c -

      - name: Dump original YTLite and YouTube host runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unpack output
          ditto -x -k reference.ipa unpack
          APP="$(find unpack/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -s "$APP/Frameworks/YTLite.dylib"
          git clone --quiet --depth 1 https://github.com/nygard/class-dump.git class-dump-source
          xcodebuild -project class-dump-source/class-dump.xcodeproj -scheme class-dump -configuration Release -derivedDataPath class-dump-build GCC_PREPROCESSOR_DEFINITIONS='PLATFORM_IOSMAC=0' CODE_SIGNING_ALLOWED=NO build
          CLASS_DUMP="$(find class-dump-build/Build/Products/Release -type f -name class-dump -perm -111 -print -quit)"
          test -n "$CLASS_DUMP"
          "$CLASS_DUMP" -C 'WelcomeVC' "$APP/Frameworks/YTLite.dylib" > output/WelcomeVC.h
          "$CLASS_DUMP" -C 'YTPSettingsBuilder|YTPSettingsPage|YTPSettingsSplitController|YTPSettingsSection|YTPSettingsCell|YTPSettingsItem|YTPPlayerEngine|YTPSystemPlayerVC|YTPPlayerVC|YTPPlayerSettings' "$APP/Frameworks/YTLite.dylib" > output/PlusClasses.h
          "$CLASS_DUMP" -C 'YTPivotBarView|YTPivotBarViewController|YTPivotBarItemView|YTTabViewController|YTTabInsertionCommandHandler|YTTabUpdateCommandHandler' "$APP/YouTube" > output/HostTabClasses.h
          otool -ov "$APP/Frameworks/YTLite.dylib" > output/ytlite-objc-runtime.txt
          otool -ov "$APP/YouTube" > output/youtube-host-objc-runtime.txt
          otool -v -s __TEXT __objc_methname "$APP/Frameworks/YTLite.dylib" > output/ytlite-method-names.txt
          strings -a "$APP/Frameworks/YTLite.dylib" > output/ytlite-strings.txt
          otool -L "$APP/Frameworks/YTLite.dylib" > output/ytlite-linkage.txt
          python3 - <<'PY'
          from pathlib import Path
          output = []
          tweak = Path("output/ytlite-objc-runtime.txt").read_text(errors="replace").splitlines()
          tweak_terms = [
              "WelcomeVC", "YTPivotTabBarController", "YTSettingsViewController",
              "YTSettingsSectionItemManager", "YTPTabHelper", "YTPDownloader",
              "YTPPlayerEngine", "YTPPlayerSettings", "YTPActionButton",
              "YTPSettingsBuilder", "YTPSettingsPage", "YTPSettingsSplitController",
              "YTPSettingsSection", "YTPSystemPlayerVC", "YTPPlayerVC",
          ]
          for term in tweak_terms:
              hits = [i for i, line in enumerate(tweak) if term in line]
              output.append(f"===== YTLITE {term}: {len(hits)} matches =====")
              for i in hits[:8]:
                  lo, hi = max(0, i - 12), min(len(tweak), i + 90)
                  output.extend(f"T{n+1}: {tweak[n]}" for n in range(lo, hi))

          host = Path("output/youtube-host-objc-runtime.txt").read_text(errors="replace").splitlines()
          host_terms = [
              "YTPivotBarView", "YTPivotBarViewController", "YTPivotBarItemView",
              "YTTabViewController", "YTTabInsertionCommandHandler",
              "YTTabUpdateCommandHandler", "YTSettingsViewController",
          ]
          for term in host_terms:
              hits = [i for i, line in enumerate(host) if term in line]
              output.append(f"===== HOST {term}: {len(hits)} matches =====")
              for i in hits[:6]:
                  lo, hi = max(0, i - 8), min(len(host), i + 75)
                  output.extend(f"H{n+1}: {host[n]}" for n in range(lo, hi))

          Path("output/runtime-class-excerpts.txt").write_text("\n".join(output) + "\n")
          print("Wrote YTLite and host Objective-C class excerpts.")
          PY
          test -s output/runtime-class-excerpts.txt
          echo "Runtime metadata captured; class availability is reported rather than assumed."

      - name: Upload runtime inspection
        uses: actions/upload-artifact@v4
        with:
          name: traptube-ytplus-runtime-inspection
          path: output/
          if-no-files-found: error
          retention-days: 14
