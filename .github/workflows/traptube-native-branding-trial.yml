# TrapTube native branding trial workflow
name: TrapTube Native Branding and Theme Trial

on:
  push:
    branches: [feature/traptube-ytplus-native-rebrand]
    paths:
      - .github/workflows/traptube-native-branding-trial.yml
      - ci/traptube-host-tweak/**
      - ci/TrapTubeStemKit/**
      - ci/patches/TrapTube-Third-Party-Notices.md
      - ci/patches/TrapTubeLaunch.storyboard
  workflow_dispatch:

concurrency:
  group: traptube-native-branding-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout TrapTube host integration
        uses: actions/checkout@v4

      - name: Download and verify pinned YTPlus host IPA
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/vulturefilezexclusive-svg/TrapTube/releases/download/ytplus-reference/YouTube.21.40.5.YTPlus.6.0b2.@ipavault.ipa'
          curl --fail --location --retry 3 "$URL" -o reference.ipa
          echo 'a3b3c51480efa95e3eba6b2389398e7f1de5b1685427973f4769efbb3b2514af  reference.ipa' | shasum -a 256 -c -

      - name: Extract TrapTube's existing house and crown app icon
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 https://github.com/vulturefilezexclusive-svg/TrapTube.git traptube-source
          mkdir -p traptube-source-project
          unzip -oq traptube-source/ci/source.zip -d traptube-source-project
          ICON_SET="$(find traptube-source-project -type d -name 'AppIcon.appiconset' -print -quit)"
          if [[ -n "$ICON_SET" ]]; then
            ICON_SOURCE="$(python3 - "$ICON_SET" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          images = [p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".png", ".jpg", ".jpeg"}]
          print(max(images, key=lambda p: p.stat().st_size) if images else "")
          PY
          )"
          else
            ICON_SOURCE="$(find traptube-source-project -type f \( -iname '*traptube*icon*.png' -o -iname '*appicon*.png' -o -iname '*logo*.png' \) -print -quit)"
          fi
          test -n "$ICON_SOURCE" && test -s "$ICON_SOURCE" || { echo "TrapTube's existing app icon asset was not found in ci/source.zip."; exit 3; }
          mkdir -p build-assets
          cp "$ICON_SOURCE" build-assets/TrapTube-source-icon
          echo "Using TrapTube icon asset: $ICON_SOURCE"

      - name: Install Theos build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install make ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      - name: Install Theos, iOS SDK, and YouTube headers
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --recurse-submodules https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          cd "$RUNNER_TEMP/theos-sdks"
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mkdir -p "$RUNNER_TEMP/theos/sdks" "$RUNNER_TEMP/theos/include"
          cp -R iPhoneOS16.5.sdk "$RUNNER_TEMP/theos/sdks/"
          git clone --quiet --depth 1 https://github.com/PoomSmart/YouTubeHeader.git "$RUNNER_TEMP/theos/include/YouTubeHeader"
          git clone --quiet --depth 1 https://github.com/PoomSmart/PSHeader.git "$RUNNER_TEMP/theos/include/PSHeader"

      - name: Build dynamic HTDemucs Stem Studio framework
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          mkdir -p build-output/Frameworks
          cd ci/TrapTubeStemKit
          xcodebuild -resolvePackageDependencies
          xcodebuild \
            -scheme TrapTubeStemKit \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/stemkit-build" \
            CODE_SIGNING_ALLOWED=NO \
            build
          FRAMEWORK="$(find "$RUNNER_TEMP/stemkit-build/Build/Products" -type d -name 'TrapTubeStemKit.framework' -print -quit)"
          STEMKIT_KIND=""
          STEMKIT_BINARY=""
          if [[ -n "$FRAMEWORK" ]]; then
            test -s "$FRAMEWORK/TrapTubeStemKit"
            ditto "$FRAMEWORK" "$GITHUB_WORKSPACE/build-output/Frameworks/TrapTubeStemKit.framework"
            STEMKIT_BINARY="$GITHUB_WORKSPACE/build-output/Frameworks/TrapTubeStemKit.framework/TrapTubeStemKit"
            STEMKIT_KIND="framework"
          else
            STEMKIT_DYLIB="$(find "$RUNNER_TEMP/stemkit-build/Build/Products" -type f -name 'libTrapTubeStemKit.dylib' -print -quit)"
            if [[ -z "$STEMKIT_DYLIB" ]]; then
              STEMKIT_DYLIB="$(find "$RUNNER_TEMP/stemkit-build/Build/Products" -type f -name 'TrapTubeStemKit.dylib' -print -quit)"
            fi
            test -n "$STEMKIT_DYLIB" && test -s "$STEMKIT_DYLIB" || { echo "SwiftPM StemKit product was neither a framework nor a dylib."; exit 4; }
            cp "$STEMKIT_DYLIB" "$GITHUB_WORKSPACE/build-output/Frameworks/libTrapTubeStemKit.dylib"
            install_name_tool -id '@rpath/libTrapTubeStemKit.dylib' "$GITHUB_WORKSPACE/build-output/Frameworks/libTrapTubeStemKit.dylib"
            STEMKIT_BINARY="$GITHUB_WORKSPACE/build-output/Frameworks/libTrapTubeStemKit.dylib"
            STEMKIT_KIND="dylib"
          fi
          otool -L "$STEMKIT_BINARY" | tee "$GITHUB_WORKSPACE/build-output/stemkit-linkage.txt"
          if otool -L "$STEMKIT_BINARY" | grep -Fq 'DemucsFramework.framework/DemucsFramework'; then
            XCFRAMEWORK="$(find "$RUNNER_TEMP/stemkit-build/SourcePackages/artifacts" "$GITHUB_WORKSPACE/ci/TrapTubeStemKit" -type d -name 'DemucsFramework.xcframework' -print -quit)"
            test -n "$XCFRAMEWORK" || { echo "DemucsFramework.xcframework dependency was not found."; exit 5; }
            DEMUCS_SLICE="$(find "$XCFRAMEWORK" -type d -path '*/ios-arm64/DemucsFramework.framework' -print -quit)"
            test -n "$DEMUCS_SLICE" || { echo "Device DemucsFramework slice was not found."; exit 5; }
            ditto "$DEMUCS_SLICE" "$GITHUB_WORKSPACE/build-output/Frameworks/DemucsFramework.framework"
          fi
          echo "TRAPTUBE_STEMKIT_FRAMEWORKS=$GITHUB_WORKSPACE/build-output/Frameworks" >> "$GITHUB_ENV"
          echo "TRAPTUBE_STEMKIT_KIND=$STEMKIT_KIND" >> "$GITHUB_ENV"

      - name: Compile native TrapTube host branding tweak
        shell: bash
        run: |
          set -euo pipefail
          make -C ci/traptube-host-tweak clean all
          DYLIB="$(find ci/traptube-host-tweak -type f -name 'TrapTubeBranding.dylib' -print -quit)"
          test -n "$DYLIB" && test -s "$DYLIB"
          mkdir -p build-output
          cp "$DYLIB" build-output/TrapTubeBranding.dylib
          if otool -L build-output/TrapTubeBranding.dylib | grep -Fq '@rpath/libsubstrate.dylib'; then
            install_name_tool -change '@rpath/libsubstrate.dylib' '@rpath/CydiaSubstrate.framework/CydiaSubstrate' build-output/TrapTubeBranding.dylib
          fi
          lipo -info build-output/TrapTubeBranding.dylib
          otool -L build-output/TrapTubeBranding.dylib | tee build-output/branding-linkage.txt

      - name: Build Mach-O dylib injector
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 https://github.com/tyilo/insert_dylib.git insert-dylib-source
          xcrun --sdk macosx clang -O2 -Wall -Wno-deprecated-declarations \
            insert-dylib-source/insert_dylib/main.c -o insert_dylib
          chmod +x insert_dylib
          ./insert_dylib --help || true

      - name: Rebrand host app, install native launch screen, and inject TrapTube settings
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/traptube-venv"
          source "$RUNNER_TEMP/traptube-venv/bin/activate"
          python -m pip install --quiet Pillow
          mkdir -p host output
          ditto -x -k reference.ipa host
          APP="$(find host/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/rubikspraypaint/RubikSprayPaint-Regular.ttf' -o "$APP/TrapTubeGraffiti.ttf"
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/rubikspraypaint/OFL.txt' -o "$APP/TrapTubeGraffiti-OFL.txt"
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          with path.open("rb") as f:
              info = plistlib.load(f)
          if info.get("CFBundleIdentifier") != "com.google.ios.youtube":
              raise SystemExit("Unexpected host bundle identifier; refusing to change it.")
          info["CFBundleDisplayName"] = "TrapTube"
          info["CFBundleName"] = "TrapTube"
          fonts = info.setdefault("UIAppFonts", [])
          if "TrapTubeGraffiti.ttf" not in fonts:
              fonts.append("TrapTubeGraffiti.ttf")
          info["UILaunchStoryboardName"] = "TrapTubeLaunchV4"
          for key in ("CFBundleIcons", "CFBundleIcons~ipad"):
              icons = info.get(key)
              if not isinstance(icons, dict):
                  continue
              icons.pop("CFBundleAlternateIcons", None)
              primary = icons.get("CFBundlePrimaryIcon")
              if isinstance(primary, dict):
                  primary.pop("CFBundleIconName", None)
          with path.open("wb") as f:
              plistlib.dump(info, f, fmt=plistlib.FMT_BINARY, sort_keys=False)
          PY
          python3 - build-assets/TrapTube-source-icon "$APP" <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter
          import sys
          source = Path(sys.argv[1])
          app = Path(sys.argv[2])
          icon = Image.open(source).convert("RGBA")
          side = min(icon.size)
          left = (icon.width - side) // 2
          top = (icon.height - side) // 2
          icon = icon.crop((left, top, left + side, top + side))
          icon1024 = icon.resize((1024, 1024), Image.Resampling.LANCZOS)
          # Flatten app icons onto the app's dark base so they remain opaque.
          opaque = Image.new("RGBA", (1024, 1024), (7, 6, 10, 255))
          opaque.alpha_composite(icon1024)
          opaque.resize((120, 120), Image.Resampling.LANCZOS).convert("RGB").save(app / "logo_youtube_2024_q4_color60x60@2x.png")
          opaque.resize((152, 152), Image.Resampling.LANCZOS).save(app / "logo_youtube_2024_q4_color76x76@2x~ipad.png")
          opaque.resize((60, 60), Image.Resampling.LANCZOS).save(app / "icon1.png")
          opaque.resize((60, 60), Image.Resampling.LANCZOS).save(app / "icon2.png")
          opaque.resize((60, 60), Image.Resampling.LANCZOS).save(app / "icon3.png")
          # A transparent launch logo is placed on the launch screen's near-black canvas.
          icon_launch = icon.resize((512, 512), Image.Resampling.LANCZOS)
          icon_launch.save(app / "TrapTubeLaunchLogoV4.png")
          print(f"Prepared TrapTube app icon from {source}")
          PY
          ibtool --compile "$APP/TrapTubeLaunchV4.storyboardc" ci/patches/TrapTubeLaunch.storyboard
          mkdir -p "$APP/Frameworks"
          if [[ -d build-output/Frameworks/TrapTubeStemKit.framework ]]; then
            ditto build-output/Frameworks/TrapTubeStemKit.framework "$APP/Frameworks/TrapTubeStemKit.framework"
          else
            cp build-output/Frameworks/libTrapTubeStemKit.dylib "$APP/Frameworks/libTrapTubeStemKit.dylib"
          fi
          if [[ -d build-output/Frameworks/DemucsFramework.framework ]]; then
            ditto build-output/Frameworks/DemucsFramework.framework "$APP/Frameworks/DemucsFramework.framework"
          fi
          cp build-output/TrapTubeBranding.dylib "$APP/Frameworks/TrapTubeBranding.dylib"
          ./insert_dylib --inplace --all-yes '@rpath/TrapTubeBranding.dylib' "$APP/YouTube"
          SWIFT_STDLIB_TOOL="$(xcrun --find swift-stdlib-tool)"
          "$SWIFT_STDLIB_TOOL" --copy --verbose \
            --scan-executable "$APP/YouTube" \
            --scan-folder "$APP/Frameworks" \
            --destination "$APP/Frameworks" \
            --platform iphoneos
          cp build-output/branding-linkage.txt output/branding-linkage.txt
          cp build-output/stemkit-linkage.txt output/stemkit-linkage.txt
          python3 - "$APP" <<'PY'
          import plistlib, sys
          from pathlib import Path

          root = Path(sys.argv[1])
          replacements = (
              ("YouTube Plus", "TrapTube"),
              ("YouTube+", "TrapTube"),
              ("YouTube", "TrapTube"),
              ("Youtube", "TrapTube"),
              ("YTPlus", "TrapTube"),
              ("YTLite", "TrapTube"),
          )
          changed_files = 0
          changed_values = 0

          def rewrite(value):
              global changed_values
              if isinstance(value, str):
                  updated = value
                  for old, new in replacements:
                      updated = updated.replace(old, new)
                  if updated != value:
                      changed_values += 1
                  return updated
              if isinstance(value, list):
                  return [rewrite(item) for item in value]
              if isinstance(value, dict):
                  return {key: rewrite(item) for key, item in value.items()}
              return value

          if root.is_dir():
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix not in (".strings", ".stringsdict"):
                      continue
                  try:
                      with path.open("rb") as stream:
                          raw = stream.read()
                      try:
                          values = plistlib.loads(raw)
                      except Exception:
                          # Some app-bundled .strings files use Apple's OpenStep
                          # text format rather than binary/XML plist encoding.
                          import subprocess
                          converted = subprocess.run(
                              ["plutil", "-convert", "xml1", "-o", "-", str(path)],
                              check=True, capture_output=True
                          ).stdout
                          values = plistlib.loads(converted)
                  except Exception as error:
                      print(f"Skipping unparseable localization resource {path}: {error}")
                      continue
                  updated = rewrite(values)
                  if updated != values:
                      with path.open("wb") as stream:
                          plistlib.dump(updated, stream, fmt=plistlib.FMT_BINARY, sort_keys=False)
                      changed_files += 1

          print(f"TrapTube localization: updated {changed_values} string values across {changed_files} files under {root}.")
          PY
          cp ci/patches/TrapTube-Third-Party-Notices.md "$APP/TrapTube-Third-Party-Notices.md"
          find "$APP" -type d -name _CodeSignature -prune -exec rm -rf {} +
          find "$APP" -type f -name CodeResources -delete
          ditto -c -k --sequesterRsrc --keepParent host/Payload output/TrapTube-YTPlus-Branding-Theme-Trial.ipa
          shasum -a 256 output/TrapTube-YTPlus-Branding-Theme-Trial.ipa | tee output/ipa-sha256.txt

      - name: Verify actual in-app integration payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify
          ditto -x -k output/TrapTube-YTPlus-Branding-Theme-Trial.ipa verify
          APP="$(find verify/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = "TrapTube"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$APP/Info.plist")" = "TrapTubeLaunchV4"
          test -s "$APP/TrapTubeLaunchV4.storyboardc/Info.plist"
          test -s "$APP/TrapTubeLaunchLogoV4.png"
          test -s "$APP/TrapTubeGraffiti.ttf"
          test -s "$APP/TrapTubeGraffiti-OFL.txt"
          test -s "$APP/Frameworks/TrapTubeBranding.dylib"
          test -s "$APP/TrapTube-Third-Party-Notices.md"
          otool -L "$APP/YouTube" | grep -F '@rpath/TrapTubeBranding.dylib'
          otool -L "$APP/Frameworks/TrapTubeBranding.dylib" | grep -F 'CydiaSubstrate.framework/CydiaSubstrate'
          otool -L "$APP/Frameworks/TrapTubeBranding.dylib" | grep -F 'TrapTubeStemKit'
          if [[ -d "$APP/Frameworks/TrapTubeStemKit.framework" ]]; then
            STEMKIT_BINARY="$APP/Frameworks/TrapTubeStemKit.framework/TrapTubeStemKit"
            test -s "$STEMKIT_BINARY"
          else
            STEMKIT_BINARY="$APP/Frameworks/libTrapTubeStemKit.dylib"
            test -s "$STEMKIT_BINARY"
          fi
          strings "$STEMKIT_BINARY" | grep -F 'TrapTubeStemStudioFactory'
          strings "$STEMKIT_BINARY" | grep -F 'TrapTubeEQFactory'
          strings "$STEMKIT_BINARY" | grep -F 'TrapTubeEQManager'
          strings "$STEMKIT_BINARY" | grep -F 'TrapTubeAudioHook'
          grep -Fq 'AVAudioUnitEQ(numberOfBands: 17)' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeEQManager.swift
          grep -Fq 'MTAudioProcessingTapCreate' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeEQManager.swift
          grep -Fq 'setMasterGainPercent' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeEQManager.swift
          grep -Fq 'TrapTubeEQFactory' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/UIControls.swift
          grep -Fq 'struct BiquadState' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeEQManager.swift
          grep -Fq 'struct BiquadCoefficients' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeEQManager.swift
          grep -Fq 'TrapTubeAudioHook' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/AudioHook.swift
          grep -Fq 'TrapTubeEqualizer' ci/traptube-host-tweak/TrapTubeBranding.x
          grep -Fq 'case .balanced: .fourStem' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeStemKit.swift
          grep -Fq 'case .sixStem: .sixStem' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeStemKit.swift
          grep -Fq 'case .fineTuned: .fineTunedAll' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeStemKit.swift
          grep -Fq 'qualityTier' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeStemKit.swift
          grep -Fq 'TrapTube.StemStudio.Model' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeStemKit.swift
          grep -Fq 'availableStemNames' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeStemKit.swift
          grep -Fq 'expectedStemCount' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeStemKit.swift
          grep -Fq 'Download model & separate' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeStemKit.swift
          grep -Fq 'DemucsEngine.download(modelToDownload)' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeStemKit.swift
          grep -Fq 'private func runSeparation()' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeStemKit.swift
          grep -Fq 'TrapTubeEQManager.shared.play(file: url)' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeStemKit.swift
          grep -Fq 'TTPruneRemovedSettingsRows(self.view)' ci/traptube-host-tweak/TrapTubeBranding.x
          grep -Fq 'TTShouldHideRenderedSettingsText' ci/traptube-host-tweak/TrapTubeBranding.x
          grep -Fq 'private lazy var engine: DemucsEngine = {' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeStemKit.swift
          grep -Fq '_ = TrapTubeStemStorage.configured' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeStemKit.swift
          grep -Fq 'return DemucsEngine()' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeStemKit.swift
          grep -Fq 'HTDemucs model loading' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeStemKit.swift
          grep -Fq 'HTDemucs source separation' ci/TrapTubeStemKit/Sources/TrapTubeStemKit/TrapTubeStemKit.swift
          if [[ -d "$APP/Frameworks/DemucsFramework.framework" ]]; then
            test -s "$APP/Frameworks/DemucsFramework.framework/DemucsFramework"
          fi
          strings "$APP/Frameworks/TrapTubeBranding.dylib" > output/branding-binary-strings.txt
          grep -Fq 'dayanch96' ci/traptube-host-tweak/TrapTubeBranding.x
          grep -Fq 'special thanks' ci/traptube-host-tweak/TrapTubeBranding.x
          grep -Fq '@"account"' ci/traptube-host-tweak/TrapTubeBranding.x
          grep -Fq 'traptube plus 6.0 b2' ci/traptube-host-tweak/TrapTubeBranding.x
          grep -Fq 'TTIsRemovedVersionFooter' ci/traptube-host-tweak/TrapTubeBranding.x
          grep -Fq 'TTApplyStemStudioSurfaceToView' ci/traptube-host-tweak/TrapTubeBranding.x
          grep -Fq 'TTStemBackgroundColor' ci/traptube-host-tweak/TrapTubeBranding.x
          grep -Fq 'VolumeBoostYTEnabled' ci/traptube-host-tweak/TrapTubeBranding.x
          grep -Fq 'CustomYouTubeVolumeScalar' ci/traptube-host-tweak/TrapTubeBranding.x
          grep -Fq 'TrapTubeStreamVolumeBoost' ci/traptube-host-tweak/TrapTubeBranding.x
          test -s "$APP/Frameworks/VolumeBoostYT.dylib"
          otool -L "$APP/YouTube" | grep -F '@rpath/VolumeBoostYT.dylib'
          grep -q 'TrapTube Appearance' output/branding-binary-strings.txt
          grep -q 'Stream Volume Boost' output/branding-binary-strings.txt
          grep -q 'TrapTube Settings' output/branding-binary-strings.txt
          grep -q 'MarkerFelt-Wide' output/branding-binary-strings.txt
          grep -q 'HOSTILE YOUTUBE TAKEOVER' output/branding-binary-strings.txt
          grep -q 'Stem Studio' output/branding-binary-strings.txt
          grep -q '16-Band Equalizer' output/branding-binary-strings.txt
          grep -q 'Set the TrapTube accent color' output/branding-binary-strings.txt
          test -s "$APP/logo_youtube_2024_q4_color60x60@2x.png"
          test -s "$APP/logo_youtube_2024_q4_color76x76@2x~ipad.png"
          unzip -tq output/TrapTube-YTPlus-Branding-Theme-Trial.ipa
          echo "Verified: TrapTube app icon payload, host-wide localized text replacement, text-only header wordmark substitution, versioned native launch storyboard, removed account/developer/credits/version settings, selectable HTDemucs 4/6/fine-tuned models with transparent quality tiers, TrapTube Settings section and Marker Felt display typography for TrapTube wordmarks, Stream Volume Boost settings wired to the existing VolumeBoostYT audio hook, 16-band EQ framework and player-item audio-tap integration, Stem Studio-aligned dark surfaces and controls, injected branding tweak, and preserved original YTLite dylib."

      - name: Upload TrapTube branded trial IPA and build audit
        uses: actions/upload-artifact@v4
        with:
          name: traptube-ytplus-branding-theme-trial-v1
          path: |
            output/TrapTube-YTPlus-Branding-Theme-Trial.ipa
            output/ipa-sha256.txt
            output/branding-linkage.txt
            output/stemkit-linkage.txt
            output/branding-binary-strings.txt
          if-no-files-found: error
          retention-days: 14
