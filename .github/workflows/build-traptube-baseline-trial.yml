name: TrapTube Baseline Trial IPA

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-traptube-baseline-trial.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-trial:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout isolated trial workflow
        uses: actions/checkout@v4

      - name: Download pinned YTPlus baseline
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/vulturefilezexclusive-svg/TrapTube/releases/download/ytplus-reference/YouTube.21.40.5.YTPlus.6.0b2.@ipavault.ipa'
          curl --fail --location --retry 3 "$URL" -o reference.ipa
          echo 'a3b3c51480efa95e3eba6b2389398e7f1de5b1685427973f4769efbb3b2514af  reference.ipa' | shasum -a 256 -c -

      - name: Rebrand display identity and validate host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          ditto -x -k reference.ipa work
          APP='work/Payload/YouTube.app'
          test -d "$APP"
          PLIST="$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST" | grep -Fx 'com.google.ios.youtube'
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName TrapTube' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName TrapTube' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 21.40.5' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Set :MinimumOSVersion 17.0' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST" | grep -Fx 'TrapTube'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST" | grep -Fx 'com.google.ios.youtube'
          test -x "$APP/YouTube"
          file "$APP/YouTube"
          find "$APP" -name '*.dylib' -print | sort > dylibs.txt
          cat dylibs.txt
          grep -q '/YTLite.dylib
          mkdir -p output
          ditto -c -k --sequesterRsrc --keepParent work/Payload output/TrapTube-YTPlus-Baseline-Trial.ipa
          shasum -a 256 output/TrapTube-YTPlus-Baseline-Trial.ipa | tee output/ipa-sha256.txt
          cat > output/TRIAL-SCOPE.txt <<'EOF'
          TrapTube / YTPlus baseline packaging trial
          Base: YouTube 21.40.5 + YTPlus 6.0b2
          Bundle ID: com.google.ios.youtube (preserved)
          Display name: TrapTube
          YTLite.dylib: verified present
          This trial verifies the pinned host archive, metadata rebrand, and IPA repackaging.
          It does NOT yet include the native Stem Studio tab, TrapTube theme settings integration,
          custom TrapTube launch screen, or HTDemucs feature injection. Those require a separately
          compiled and runtime-verified host integration component.
          The IPA is unsigned and must be signed with a compatible sideloading identity.
          EOF

      - name: Upload trial IPA and validation report
        uses: actions/upload-artifact@v4
        with:
          name: traptube-ytplus-baseline-trial
          path: |
            output/TrapTube-YTPlus-Baseline-Trial.ipa
            output/ipa-sha256.txt
            output/TRIAL-SCOPE.txt
          if-no-files-found: error
          retention-days: 14
 dylibs.txt
          mkdir -p output
          ditto -c -k --sequesterRsrc --keepParent work/Payload output/TrapTube-YTPlus-Baseline-Trial.ipa
          shasum -a 256 output/TrapTube-YTPlus-Baseline-Trial.ipa | tee output/ipa-sha256.txt
          cat > output/TRIAL-SCOPE.txt <<'EOF'
          TrapTube / YTPlus baseline packaging trial
          Base: YouTube 21.40.5 + YTPlus 6.0b2
          Bundle ID: com.google.ios.youtube (preserved)
          Display name: TrapTube
          YTLite.dylib: verified present
          This trial verifies the pinned host archive, metadata rebrand, and IPA repackaging.
          It does NOT yet include the native Stem Studio tab, TrapTube theme settings integration,
          custom TrapTube launch screen, or HTDemucs feature injection. Those require a separately
          compiled and runtime-verified host integration component.
          The IPA is unsigned and must be signed with a compatible sideloading identity.
          EOF

      - name: Upload trial IPA and validation report
        uses: actions/upload-artifact@v4
        with:
          name: traptube-ytplus-baseline-trial
          path: |
            output/TrapTube-YTPlus-Baseline-Trial.ipa
            output/ipa-sha256.txt
            output/TRIAL-SCOPE.txt
          if-no-files-found: error
          retention-days: 14
