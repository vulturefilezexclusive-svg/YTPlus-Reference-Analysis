name: TrapTube Baseline Trial IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-trial:
    name: Repackage pinned host IPA with TrapTube identity
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout isolated trial workflow
        uses: actions/checkout@v4

      - name: Download pinned YTPlus host IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/input build/output
          curl --fail --location --retry 3 \
            "https://github.com/vulturefilezexclusive-svg/TrapTube/releases/download/traptube-baseline-source-v1/YTPlus_21.40.5_6.0b2.ipa" \
            --output build/input/host.ipa
          echo "a3b3c51480efa95e3eba6b2389398e7f1de5b1685427973f4769efbb3b2514af  build/input/host.ipa" | shasum -a 256 -c -

      - name: Rebrand display identity and validate host
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import plistlib
          import shutil
          import zipfile
          from pathlib import Path

          source = Path("build/input/host.ipa")
          output = Path("build/output/TrapTube_Baseline_Trial_21.40.5_6.0b2.ipa")
          work = Path("build/work")
          if work.exists():
              shutil.rmtree(work)
          work.mkdir(parents=True)

          with zipfile.ZipFile(source) as archive:
              archive.extractall(work)
              names = archive.namelist()

          apps = list((work / "Payload").glob("*.app"))
          if len(apps) != 1:
              raise SystemExit(f"Expected exactly one app bundle, found {len(apps)}")
          app = apps[0]
          info_path = app / "Info.plist"
          with info_path.open("rb") as handle:
              info = plistlib.load(handle)

          bundle_id = info.get("CFBundleIdentifier")
          executable = info.get("CFBundleExecutable")
          if bundle_id != "com.google.ios.youtube":
              raise SystemExit(f"Unexpected host bundle id: {bundle_id}")
          if executable != "YouTube":
              raise SystemExit(f"Unexpected host executable: {executable}")

          info["CFBundleDisplayName"] = "TrapTube"
          info["CFBundleName"] = "TrapTube"
          with info_path.open("wb") as handle:
              plistlib.dump(info, handle, fmt=plistlib.FMT_BINARY)

          dylibs = sorted(name for name in names if "/Frameworks/" in name and name.endswith(".dylib"))
          (work / "dylib-inventory.txt").write_text("\n".join(dylibs) + "\n")

          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(work.rglob("*")):
                  if path.is_file() and path.name not in {"dylib-inventory.txt"}:
                      archive.write(path, path.relative_to(work).as_posix())

          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          Path("build/output/TrapTube_Baseline_Trial_21.40.5_6.0b2.ipa.sha256").write_text(
              f"{digest}  {output.name}\n"
          )
          Path("build/output/TRIAL-SCOPE.txt").write_text(
              "Experimental display-name-only build.\n"
              "Host signing, bundle ID, PlugIns, Watch content, frameworks and dylibs are unchanged.\n"
              "Stem Studio and the equalizer are host-tweak features injected by the native-branding workflow; this baseline validates host identity only.\n"
              f"Source IPA SHA-256: a3b3c51480efa95e3eba6b2389398e7f1de5b1685427973f4769efbb3b2514af\n"
              f"Rebranded app: {app.name}\n"
          )
          print(f"Created {output} sha256={digest}")
          PY

      - name: Repackage baseline trial IPA
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            build/work/Payload \
            build/output/TrapTube_Baseline_Trial_21.40.5_6.0b2.ipa
          shasum -a 256 build/output/TrapTube_Baseline_Trial_21.40.5_6.0b2.ipa \
            > build/output/TrapTube_Baseline_Trial_21.40.5_6.0b2.ipa.sha256
          cp build/work/dylib-inventory.txt build/output/dylib-inventory.txt

      - name: Upload trial IPA and validation report
        uses: actions/upload-artifact@v4
        with:
          name: traptube-ytplus-baseline-trial
          path: |
            build/output/TrapTube_Baseline_Trial_21.40.5_6.0b2.ipa
            build/output/TrapTube_Baseline_Trial_21.40.5_6.0b2.ipa.sha256
            build/output/TRIAL-SCOPE.txt
            build/output/dylib-inventory.txt
          if-no-files-found: error
          retention-days: 14
