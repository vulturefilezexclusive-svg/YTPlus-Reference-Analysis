name: TrapTube Baseline Trial IPA

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-traptube-baseline-trial.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-trial:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout isolated trial workflow
        uses: actions/checkout@v4

      - name: Download pinned YTPlus baseline
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/vulturefilezexclusive-svg/TrapTube/releases/download/ytplus-reference/YouTube.21.40.5.YTPlus.6.0b2.@ipavault.ipa'
          curl --fail --location --retry 3 "$URL" -o reference.ipa
          echo 'a3b3c51480efa95e3eba6b2389398e7f1de5b1685427973f4769efbb3b2514af  reference.ipa' | shasum -a 256 -c -

      - name: Rebrand display identity and validate host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work output
          ditto -x -k reference.ipa work
          python3 <<'PY'
          import plistlib
          from pathlib import Path

          payload = Path("work/Payload")
          apps = list(payload.glob("*.app"))
          if len(apps) != 1:
              raise SystemExit(f"Expected exactly one .app, found {len(apps)}")
          app = apps[0]
          plist_path = app / "Info.plist"
          with plist_path.open("rb") as f:
              info = plistlib.load(f)
          bundle_id = info.get("CFBundleIdentifier")
          if bundle_id != "com.google.ios.youtube":
              raise SystemExit(f"Unexpected bundle ID: {bundle_id!r}")
          executable = info.get("CFBundleExecutable")
          if not executable or not (app / executable).is_file():
              raise SystemExit(f"Main executable missing: {executable!r}")
          info["CFBundleDisplayName"] = "TrapTube"
          info["CFBundleName"] = "TrapTube"
          info["CFBundleShortVersionString"] = "21.40.5"
          info["MinimumOSVersion"] = "17.0"
          with plist_path.open("wb") as f:
              plistlib.dump(info, f, fmt=plistlib.FMT_BINARY, sort_keys=False)
          dylibs = sorted(str(p.relative_to(app)) for p in app.rglob("*.dylib"))
          ytlite = [p for p in dylibs if Path(p).name == "YTLite.dylib"]
          (Path("output") / "dylib-inventory.txt").write_text(
              "\\n".join(dylibs) + "\\n", encoding="utf-8"
          )
          (Path("output") / "TRIAL-SCOPE.txt").write_text(
              "TrapTube / YTPlus baseline packaging trial\\n"
              "Base: YouTube 21.40.5 + YTPlus 6.0b2\\n"
              f"Bundle ID: {bundle_id} (preserved)\\n"
              "Display name: TrapTube\\n"
              f"YTLite.dylib found: {bool(ytlite)}\\n"
              "This trial verifies the pinned host archive, metadata rebrand, and IPA repackaging.\\n"
              "It does NOT yet include the native Stem Studio tab, TrapTube theme settings integration, "
              "custom TrapTube launch screen, or HTDemucs feature injection. Those require a separately "
              "compiled and runtime-verified host integration component.\\n"
              "The IPA is unsigned and must be signed with a compatible sideloading identity.\\n",
              encoding="utf-8"
          )
          print(f"Validated {app.name}; bundle={bundle_id}; executable={executable}")
          print(f"Found {len(dylibs)} dylibs; YTLite.dylib present={bool(ytlite)}")
          PY
          ditto -c -k --sequesterRsrc --keepParent work/Payload output/TrapTube-YTPlus-Baseline-Trial.ipa
          shasum -a 256 output/TrapTube-YTPlus-Baseline-Trial.ipa | tee output/ipa-sha256.txt

      - name: Upload trial IPA and validation report
        uses: actions/upload-artifact@v4
        with:
          name: traptube-ytplus-baseline-trial
          path: |
            output/TrapTube-YTPlus-Baseline-Trial.ipa
            output/ipa-sha256.txt
            output/TRIAL-SCOPE.txt\n            output/dylib-inventory.txt
          if-no-files-found: error
          retention-days: 14
 dylibs.txt
          mkdir -p output
          ditto -c -k --sequesterRsrc --keepParent work/Payload output/TrapTube-YTPlus-Baseline-Trial.ipa
          shasum -a 256 output/TrapTube-YTPlus-Baseline-Trial.ipa | tee output/ipa-sha256.txt
          cat > output/TRIAL-SCOPE.txt <<'EOF'
          TrapTube / YTPlus baseline packaging trial
          Base: YouTube 21.40.5 + YTPlus 6.0b2
          Bundle ID: com.google.ios.youtube (preserved)
          Display name: TrapTube
          YTLite.dylib: verified present
          This trial verifies the pinned host archive, metadata rebrand, and IPA repackaging.
          It does NOT yet include the native Stem Studio tab, TrapTube theme settings integration,
          custom TrapTube launch screen, or HTDemucs feature injection. Those require a separately
          compiled and runtime-verified host integration component.
          The IPA is unsigned and must be signed with a compatible sideloading identity.
          EOF

      - name: Upload trial IPA and validation report
        uses: actions/upload-artifact@v4
        with:
          name: traptube-ytplus-baseline-trial
          path: |
            output/TrapTube-YTPlus-Baseline-Trial.ipa
            output/ipa-sha256.txt
            output/TRIAL-SCOPE.txt
          if-no-files-found: error
          retention-days: 14
